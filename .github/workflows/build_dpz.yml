name: Build DPZ Clone App

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate DPZ Clone App Source Code
        run: |
          mkdir -p dpz_app/app/src/main/java/com/dpz/cloneapp
          mkdir -p dpz_app/app/src/main/res/layout
          mkdir -p dpz_app/app/src/main/res/values
          mkdir -p dpz_app/app/src/main/res/drawable
          mkdir -p dpz_app/app/src/main/res/mipmap-xxxhdpi

          # 0. gradle.properties
          cat << 'EOF' > dpz_app/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 1. settings.gradle
          cat << 'EOF' > dpz_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DPZ Clone App"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > dpz_app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. App build.gradle (No Kotlin conflict)
          cat << 'EOF' > dpz_app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dpz.cloneapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dpz.cloneapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > dpz_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.DPZClone">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. strings.xml, colors.xml & themes.xml
          cat << 'EOF' > dpz_app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">DPZ Clone App</string>
          </resources>
          EOF

          cat << 'EOF' > dpz_app/app/src/main/res/values/colors.xml
          <resources>
              <color name="dpz_blue">#0066FF</color>
              <color name="dpz_cyan">#00E5FF</color>
              <color name="dpz_dark">#0D1117</color>
              <color name="dpz_card">#161B22</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat << 'EOF' > dpz_app/app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.DPZClone" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/dpz_blue</item>
                  <item name="colorPrimaryDark">@color/dpz_dark</item>
                  <item name="colorAccent">@color/dpz_cyan</item>
                  <item name="android:windowBackground">@color/dpz_dark</item>
              </style>
          </resources>
          EOF

          # 6. Custom Card Background
          cat << 'EOF' > dpz_app/app/src/main/res/drawable/card_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#161B22" />
              <corners android:radius="12dp" />
              <stroke android:width="1dp" android:color="#0066FF" />
          </shape>
          EOF

          # 7. activity_main.xml & list_item.xml
          cat << 'EOF' > dpz_app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/dpz_dark"
              android:padding="16dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="DPZ CLONE HUB"
                  android:textColor="@color/dpz_cyan"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="4dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Tap any app to clone & launch in DPZ Space"
                  android:textColor="#8B949E"
                  android:textSize="13sp"
                  android:layout_marginBottom="16dp" />

              <ListView
                  android:id="@+id/app_list"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:divider="@android:color/transparent"
                  android:dividerHeight="10dp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > dpz_app/app/src/main/res/layout/list_item.xml
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/item_text"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="@drawable/card_bg"
              android:padding="16dp"
              android:textColor="#FFFFFF"
              android:textSize="16sp"
              android:textStyle="bold" />
          EOF

          # 8. MainActivity.java
          cat << 'EOF' > dpz_app/app/src/main/java/com/dpz/cloneapp/MainActivity.java
          package com.dpz.cloneapp;

          import android.content.Intent;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.widget.ArrayAdapter;
          import android.widget.ListView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  ListView listView = findViewById(R.id.app_list);
                  PackageManager pm = getPackageManager();
                  List<ApplicationInfo> packages = pm.getInstalledApplications(PackageManager.GET_META_DATA);

                  List<String> appNames = new ArrayList<>();
                  List<String> packageNames = new ArrayList<>();

                  for (ApplicationInfo appInfo : packages) {
                      if (pm.getLaunchIntentForPackage(appInfo.packageName) != null) {
                          appNames.add("⚡  " + pm.getApplicationLabel(appInfo).toString());
                          packageNames.add(appInfo.packageName);
                      }
                  }

                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, R.layout.list_item, R.id.item_text, appNames);
                  listView.setAdapter(adapter);

                  listView.setOnItemClickListener((parent, view, position, id) -> {
                      String pkg = packageNames.get(position);
                      Intent launchIntent = pm.getLaunchIntentForPackage(pkg);
                      if (launchIntent != null) {
                          Toast.makeText(this, "Opening in DPZ Clone Space...", Toast.LENGTH_SHORT).show();
                          startActivity(launchIntent);
                      }
                  });
              }
          }
          EOF

      - name: Apply & Optimize Custom DPZ Logo
        run: |
          if [ -f "ic_launcher.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert ic_launcher.png -resize 192x192 PNG32:dpz_app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: Build DPZ APK
        run: |
          cd dpz_app
          gradle wrapper --gradle-version 8.4
          ./gradlew assembleDebug --no-daemon

      - name: Upload DPZ Clone APK
        uses: actions/upload-artifact@v4
        with:
          name: DPZ-Clone-App
          path: dpz_app/app/build/outputs/apk/debug/app-debug.apk
          
